{% extends 'base.html' %}

{% block title %}Edit Patient{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">Edit Patient Information</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                    <div class="messages mb-4">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <h5>Personal Information</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name*</label>
                                    <input type="text" name="first_name" class="form-control" 
                                           value="{{ patient.user.first_name }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name*</label>
                                    <input type="text" name="last_name" class="form-control" 
                                           value="{{ patient.user.last_name }}" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Phone Number*</label>
                                    <input type="tel" name="phone" class="form-control" 
                                           value="{{ patient.user.phone }}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Date of Birth*</label>
                                    <input type="date" name="date_of_birth" class="form-control" 
                                           value="{{ patient.date_of_birth|date:'Y-m-d' }}" required>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Gender*</label>
                                    <select name="gender" class="form-select" required>
                                        <option value="MALE" {% if patient.gender == 'MALE' %}selected{% endif %}>Male</option>
                                        <option value="FEMALE" {% if patient.gender == 'FEMALE' %}selected{% endif %}>Female</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Emergency Contact*</label>
                                    <input type="tel" name="emergency_contact" class="form-control" 
                                           value="{{ patient.emergency_contact }}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address*</label>
                                <textarea name="address" class="form-control" rows="2" required>{{ patient.address }}</textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'patient_detail' patient.pk %}" class="btn btn-secondary">Back to Patient Details</a>
                            <button type="submit" class="btn btn-primary">Update Patient Information</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
