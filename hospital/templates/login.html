{% extends 'base.html' %}
{% load static %}

{% block title %}Login - MediTrack{% endblock %}

{% block auth_content %}
<div style="min-height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); padding: 2rem 0;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div style="background: white; padding: 2.5rem; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <div class="text-center mb-4">
                        <img src="{% static 'images/logo.png' %}" alt="MediTrack Logo" style="max-width: 150px; margin-bottom: 1rem;">
                        <h2 style="color: #2c3e50; margin-bottom: 0.5rem;">Welcome Back</h2>
                        <p style="color: #666;">Please login to your account</p>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" style="border-radius: 8px; border: none; box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05);">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" action="{% url 'login' %}" class="login-form">
                        {% csrf_token %}
                        <div class="form-group mb-4">
                            <label for="username" style="color: #2c3e50; font-weight: 500; margin-bottom: 0.5rem;">Username</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: #f8f9fa; border-right: none;">
                                    <i class="fas fa-user" style="color: #3498db;"></i>
                                </span>
                                <input type="text" name="username" id="username" class="form-control" style="border-left: none; border-radius: 0 8px 8px 0; padding: 0.75rem 1rem;" required>
                            </div>
                        </div>
                        <div class="form-group mb-4">
                            <label for="password" style="color: #2c3e50; font-weight: 500; margin-bottom: 0.5rem;">Password</label>
                            <div class="input-group">
                                <span class="input-group-text" style="background-color: #f8f9fa; border-right: none;">
                                    <i class="fas fa-lock" style="color: #3498db;"></i>
                                </span>
                                <input type="password" name="password" id="password" class="form-control" style="border-left: none; border-radius: 0 8px 8px 0; padding: 0.75rem 1rem;" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" style="padding: 0.8rem; font-size: 1.1rem; background: linear-gradient(135deg, #3498db 0%, #2c3e50 100%); border: none; border-radius: 8px; transition: transform 0.3s ease;">
                            <i class="fas fa-sign-in-alt me-2"></i> Login
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.form-control:focus {
    box-shadow: none;
    border-color: #ced4da;
}

.btn-primary:hover {
    transform: translateY(-2px);
}

.input-group-text {
    border-radius: 8px 0 0 8px;
}

.alert {
    margin-bottom: 1.5rem;
}

@media (max-width: 768px) {
    .login-container {
        padding: 1.5rem;
    }
}
</style>
{% endblock %}
