{% extends 'base.html' %}

{% block title %}Add New Patient{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title mb-0">Add New Patient</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                    <div class="messages mb-4">
                        {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name*</label>
                                <input type="text" name="first_name" class="form-control" required 
                                       value="{{ form_data.first_name|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name*</label>
                                <input type="text" name="last_name" class="form-control" required
                                       value="{{ form_data.last_name|default:'' }}">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Gender*</label>
                                <select name="gender" class="form-select" required>
                                    <option value="">Select Gender</option>
                                    <option value="MALE" {% if form_data.gender == 'MALE' %}selected{% endif %}>Male</option>
                                    <option value="FEMALE" {% if form_data.gender == 'FEMALE' %}selected{% endif %}>Female</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number*</label>
                                <input type="tel" name="phone" class="form-control" required
                                       value="{{ form_data.phone|default:'' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Street Address*</label>
                            <textarea name="address" class="form-control" rows="2" required>{{ form_data.address|default:'' }}</textarea>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Date of Birth*</label>
                                <input type="date" name="date_of_birth" class="form-control" required
                                       value="{{ form_data.date_of_birth|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Emergency Contact*</label>
                                <input type="tel" name="emergency_contact" class="form-control" required
                                       value="{{ form_data.emergency_contact|default:'' }}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'patient_list' %}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Register Patient</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
